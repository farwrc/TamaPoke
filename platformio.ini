; TamaPoke para a Waveshare ESP32-S3-Touch-LCD-2.8B (K10 PRO)
; Abrir ESTA pasta (a raiz do fork) no VS Code com a extensao PlatformIO.
; O codigo da placa K10 fica na pasta k10/. Os arquivos do jogo na raiz sao os do projeto original,
; com pequenos desvios marcados por BOARD_K10_PRO.

[platformio]
src_dir = .
default_envs = k10_pro

[env:k10_pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_build.psram = enabled
board_build.partitions = default_16MB.csv

; versoes fixas (as ultimas na data do port) para o projeto nao mudar sozinho
lib_deps =
  https://github.com/moononournation/Arduino_GFX.git#v1.6.9
  https://github.com/olikraus/U8g2_Arduino.git#2.37.1
  https://github.com/lewisxhe/SensorLib.git#v0.5.1

build_flags =
  -DBOARD_K10_PRO
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -I k10

; so' o jogo (raiz) e a camada da placa (k10/); tools/, web/ e test/ nao entram na compilacao
build_src_filter =
  -<*>
  +<*.ino>
  +<TamaPoke.ino.cpp>
  +<pet.cpp>
  +<sdmon.cpp>
  +<i18n.cpp>
  +<rtcbat.cpp>
  +<audio.cpp>
  +<k10/>
